<div class="course-card">

  <h3>{{ course.name }}</h3>

  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits }}</p>
  <p><strong>Status:</strong> {{ course.gradeStatus }}</p>

  <button
    *ngIf="!((enrolledIds$ | async)?.includes(course.id))"
    (click)="enroll()">
    Enroll
  </button>

  <button
    *ngIf="(enrolledIds$ | async)?.includes(course.id)"
    (click)="unenroll()">
    Unenroll
  </button>

</div>

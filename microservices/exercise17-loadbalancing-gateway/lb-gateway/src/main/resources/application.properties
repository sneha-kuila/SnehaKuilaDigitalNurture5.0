server.port=9092
spring.application.name=lb-gateway

# Load-balanced route: forwards to whichever example-service instance the
# load balancer picks (registered via Eureka)
spring.cloud.gateway.routes[0].id=load_balanced_route
spring.cloud.gateway.routes[0].uri=lb://example-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/loadbalanced/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/loadbalanced/(?<segment>.*), /${segment}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.application.name=config-server
server.port=8888

# Native profile serves config from a local folder instead of a git repo.
# Simplest to set up for a hands-on exercise; swap to spring.cloud.config.server.git.uri
# to point at a real Git-backed config repo in production.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo
